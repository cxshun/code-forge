# Code Forge 本地全栈环境（design §3.4，MVP = Docker Compose）。
# 用法：cp deploy/.env.example .env && docker compose -f deploy/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: codeforge
      POSTGRES_DB: codeforge
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge -d codeforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    environment:
      APP_ENV: dev
      PG_DSN: postgresql+asyncpg://codeforge:codeforge@postgres:5432/codeforge
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    env_file:
      - ../.env
    volumes:
      - app_data:/data
      - ../backend:/app # 开发热加载；生产构建去掉，改用镜像内打包
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    environment:
      # 容器内通过后端服务名访问 API（vite proxy 目标）
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: pnpm dev --host 0.0.0.0

volumes:
  pg_data:
  redis_data:
  app_data:
