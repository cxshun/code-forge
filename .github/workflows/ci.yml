name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      PG_DSN: postgresql+asyncpg://codeforge:codeforge@localhost:5432/codeforge
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeforge
          POSTGRES_PASSWORD: codeforge
          POSTGRES_DB: codeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeforge -d codeforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q
      - name: Alembic upgrade (apply migrations)
        run: uv run alembic upgrade head
      - name: Alembic check (detect model drift)
        run: uv run alembic check

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # TODO：package.json 稳定后改 --frozen-lockfile
      - run: pnpm install
      - name: Build
        run: pnpm build
